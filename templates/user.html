{% extends "base.html" %} {% block title %}User Dashboard{% endblock %} {% block
content %}
<h3 class="mb-3">IOC Lookup</h3>

<form method="POST" action="{{ url_for('search') }}" class="row g-2 mb-4">
  <div class="col-md-8">
    <input name="url" class="form-control" placeholder="Search URL" />
  </div>
  <div class="col-md-4">
    <button class="btn btn-primary w-100">Search</button>
  </div>
</form>

<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>URL</th>
        <th>Source</th>
        <th>Date Added</th>
      </tr>
    </thead>
    <tbody>
      {% for url, source, date in iocs %}
      <tr>
        <td>{{ loop.index }}</td>
        <td><a href="{{ url }}" target="_blank">{{ url }}</a></td>
        <td>{{ source }}</td>
        <td>{{ date }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
