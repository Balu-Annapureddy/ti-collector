<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}TI Collector{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-light" id="body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="#">TI Collector</a>
      <div class="ms-auto d-flex align-items-center">
        <span class="text-white me-3"
          >{{ user.username if user else '' }} ({{ user.role if user else ''
          }})</span
        >
        <button class="btn btn-outline-light btn-sm me-2" id="themeToggle">
          🌓
        </button>
        <a class="btn btn-danger btn-sm" href="{{ url_for('logout') }}"
          >Logout</a
        >
      </div>
    </nav>
    <div class="container py-4">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
