{% extends "base.html" %} {% block title %}Admin Dashboard{% endblock %} {%
block content %}
<h3 class="mb-3">Welcome Admin</h3>

<div class="card mb-4 p-3">
  <h5>Add New IOC</h5>
  <form method="POST" action="{{ url_for('add_ioc_route') }}" class="row g-2">
    <div class="col-md-8">
      <input
        name="url"
        class="form-control"
        placeholder="Enter malicious URL"
        required
      />
    </div>
    <div class="col-md-4">
      <button class="btn btn-success w-100" type="submit">Add IOC</button>
    </div>
  </form>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>URL</th>
        <th>Source</th>
        <th>Date Added</th>
      </tr>
    </thead>
    <tbody>
      {% for url, source, date in iocs %}
      <tr>
        <td>{{ loop.index }}</td>
        <td><a href="{{ url }}" target="_blank">{{ url }}</a></td>
        <td>{{ source }}</td>
        <td>{{ date }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
